<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>今天喝哪家？</title>
  <style>
    :root { color-scheme: light dark; }
    html { background: light-dark(#eee8e2, #100e0c); }
    body { margin: 0; padding: 16px; }
    @media (max-width: 620px) { body { padding: 0; } }
  </style>
</head>
<body>
<div id="drink-shop-draw">
  <style>
    #drink-shop-draw {
      --ds-page: light-dark(#f6f2ed, #171411);
      --ds-surface: light-dark(#fffdf9, #24201c);
      --ds-surface-soft: light-dark(#eee7df, #302a25);
      --ds-text: light-dark(#241d18, #f6eee7);
      --ds-muted: light-dark(#76685e, #b9aaa0);
      --ds-line: light-dark(#ded4cb, #494039);
      --ds-brand: light-dark(#8f2f3d, #d77783);
      --ds-brand-text: light-dark(#fffaf6, #261114);
      --ds-danger: light-dark(#a13636, #f08b8b);
      color: var(--ds-text);
      font-family: ui-rounded, "Noto Sans TC", system-ui, sans-serif;
      width: 100%;
    }
    #drink-shop-draw * { box-sizing: border-box; }
    #drink-shop-draw [hidden] { display: none !important; }
    #drink-shop-draw .ds-app {
      background: var(--ds-page);
      border: 1px solid var(--ds-line);
      border-radius: 24px;
      overflow: hidden;
    }
    #drink-shop-draw .ds-topbar {
      align-items: center;
      background: var(--ds-surface);
      border-bottom: 1px solid var(--ds-line);
      display: flex;
      justify-content: space-between;
      padding: 16px 20px;
    }
    #drink-shop-draw .ds-brand { display: flex; gap: 10px; align-items: center; }
    #drink-shop-draw .ds-logo {
      align-items: center;
      background: var(--ds-brand);
      border-radius: 12px;
      color: var(--ds-brand-text);
      display: flex;
      height: 36px;
      justify-content: center;
      width: 36px;
    }
    #drink-shop-draw h1,
    #drink-shop-draw h2,
    #drink-shop-draw p { margin: 0; }
    #drink-shop-draw h1 { font-size: 18px; font-weight: 500; }
    #drink-shop-draw h2 { font-size: 16px; font-weight: 500; }
    #drink-shop-draw .ds-kicker,
    #drink-shop-draw .ds-count,
    #drink-shop-draw .ds-note { color: var(--ds-muted); font-size: 13px; }
    #drink-shop-draw .ds-tabs {
      background: var(--ds-surface);
      border-bottom: 1px solid var(--ds-line);
      display: flex;
      gap: 6px;
      padding: 8px 20px;
    }
    #drink-shop-draw .ds-tab {
      background: transparent;
      border-color: transparent;
      color: var(--ds-muted);
      padding: 8px 12px;
    }
    #drink-shop-draw .ds-tab.is-active {
      background: var(--ds-surface-soft);
      border-color: var(--ds-line);
      color: var(--ds-text);
    }
    #drink-shop-draw .ds-layout {
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(0, 1.25fr) minmax(260px, .75fr);
      padding: 20px;
    }
    #drink-shop-draw .ds-panel {
      background: var(--ds-surface);
      border: 1px solid var(--ds-line);
      border-radius: 18px;
      padding: 18px;
    }
    #drink-shop-draw .ds-heading-row {
      align-items: baseline;
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    #drink-shop-draw .ds-manager summary {
      align-items: center;
      background: var(--ds-surface-soft);
      border: 1px solid var(--ds-line);
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      list-style: none;
      padding: 10px 12px;
    }
    #drink-shop-draw .ds-manager summary::-webkit-details-marker { display: none; }
    #drink-shop-draw .ds-manager summary:focus-visible { outline: 3px solid color-mix(in srgb, var(--ds-brand) 35%, transparent); outline-offset: 2px; }
    #drink-shop-draw .ds-manager-label { align-items: center; display: flex; gap: 8px; font-size: 14px; font-weight: 500; }
    #drink-shop-draw .ds-manager-chevron { transition: transform .18s ease; }
    #drink-shop-draw .ds-manager[open] .ds-manager-chevron { transform: rotate(180deg); }
    #drink-shop-draw .ds-manager-body { padding-top: 12px; }
    #drink-shop-draw .ds-add {
      display: grid;
      gap: 8px;
      grid-template-columns: minmax(0, 1fr) auto;
      margin-bottom: 14px;
    }
    #drink-shop-draw .ds-sr-only {
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      height: 1px;
      overflow: hidden;
      position: absolute;
      white-space: nowrap;
      width: 1px;
    }
    #drink-shop-draw input[type="text"] {
      background: var(--ds-page);
      border: 1px solid var(--ds-line);
      border-radius: 12px;
      color: var(--ds-text);
      font: inherit;
      min-width: 0;
      padding: 10px 12px;
    }
    #drink-shop-draw button {
      align-items: center;
      border: 1px solid var(--ds-line);
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      font: inherit;
      font-weight: 500;
      gap: 7px;
      justify-content: center;
      padding: 10px 14px;
    }
    #drink-shop-draw button:focus-visible,
    #drink-shop-draw input:focus-visible { outline: 3px solid color-mix(in srgb, var(--ds-brand) 35%, transparent); outline-offset: 2px; }
    #drink-shop-draw .ds-secondary { background: var(--ds-surface-soft); color: var(--ds-text); }
    #drink-shop-draw .ds-primary { background: var(--ds-brand); border-color: var(--ds-brand); color: var(--ds-brand-text); }
    #drink-shop-draw button:disabled { cursor: not-allowed; opacity: .55; }
    #drink-shop-draw .ds-list { display: grid; gap: 8px; }
    #drink-shop-draw .ds-store {
      align-items: center;
      background: var(--ds-page);
      border: 1px solid var(--ds-line);
      border-radius: 13px;
      display: grid;
      gap: 10px;
      grid-template-columns: auto minmax(0, 1fr) auto;
      padding: 10px 12px;
    }
    #drink-shop-draw .ds-store-name { font-size: 14px; }
    #drink-shop-draw .ds-store input { accent-color: var(--ds-brand); height: 18px; width: 18px; }
    #drink-shop-draw .ds-remove {
      background: transparent;
      border: 0;
      color: var(--ds-muted);
      padding: 5px;
    }
    #drink-shop-draw .ds-remove:hover { color: var(--ds-danger); }
    #drink-shop-draw .ds-draw-panel { display: flex; flex-direction: column; gap: 14px; }
    #drink-shop-draw .ds-drum {
      align-items: center;
      background: var(--ds-surface-soft);
      border: 1px dashed var(--ds-line);
      border-radius: 16px;
      display: flex;
      flex: 1;
      justify-content: center;
      min-height: 180px;
      padding: 24px 18px;
      text-align: center;
    }
    #drink-shop-draw .ds-result-icon { color: var(--ds-brand); margin: 0 auto 10px; }
    #drink-shop-draw .ds-result-label { color: var(--ds-muted); font-size: 13px; margin-bottom: 7px; }
    #drink-shop-draw .ds-result-name { font-size: 24px; font-weight: 500; overflow-wrap: anywhere; }
    #drink-shop-draw .ds-actions { display: grid; gap: 8px; }
    #drink-shop-draw .ds-actions button { width: 100%; }
    #drink-shop-draw .ds-draw.is-hidden,
    #drink-shop-draw .ds-new-round { display: none; }
    #drink-shop-draw .ds-new-round.is-visible { display: inline-flex; }
    #drink-shop-draw .ds-confirm { display: none; grid-template-columns: 1fr 1fr; }
    #drink-shop-draw .ds-confirm.is-visible { display: grid; }
    #drink-shop-draw .ds-toast {
      background: var(--ds-brand);
      border-radius: 12px;
      color: var(--ds-brand-text);
      display: none;
      padding: 11px 13px;
      text-align: center;
    }
    #drink-shop-draw .ds-toast.is-visible { display: block; }
    #drink-shop-draw .ds-menu-view { padding: 20px; }
    #drink-shop-draw .ds-menu-header {
      align-items: end;
      display: grid;
      gap: 16px;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 320px);
      margin-bottom: 18px;
    }
    #drink-shop-draw .ds-menu-intro { color: var(--ds-muted); font-size: 13px; margin-top: 5px; }
    #drink-shop-draw .ds-search-wrap { position: relative; }
    #drink-shop-draw .ds-search-wrap > svg {
      color: var(--ds-muted);
      left: 12px;
      pointer-events: none;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }
    #drink-shop-draw .ds-menu-search { padding-left: 38px; width: 100%; }
    #drink-shop-draw .ds-menu-list {
      background: var(--ds-surface);
      border: 1px solid var(--ds-line);
      border-radius: 18px;
      overflow: hidden;
    }
    #drink-shop-draw .ds-menu-item {
      align-items: center;
      background: var(--ds-surface);
      border: 0;
      border-radius: 0;
      color: var(--ds-text);
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(0, 1fr) auto;
      padding: 13px 16px;
      text-align: left;
      width: 100%;
    }
    #drink-shop-draw .ds-menu-item + .ds-menu-item { border-top: 1px solid var(--ds-line); }
    #drink-shop-draw .ds-menu-item:hover { background: var(--ds-surface-soft); }
    #drink-shop-draw .ds-menu-name { display: block; font-size: 15px; font-weight: 500; }
    #drink-shop-draw .ds-menu-summary { color: var(--ds-muted); display: block; font-size: 12px; font-weight: 400; margin-top: 3px; }
    #drink-shop-draw .ds-menu-arrow { color: var(--ds-muted); }
    #drink-shop-draw .ds-menu-detail {
      background: var(--ds-surface);
      border: 1px solid var(--ds-line);
      border-radius: 18px;
      padding: 18px;
    }
    #drink-shop-draw .ds-menu-detail-head {
      align-items: flex-start;
      display: flex;
      gap: 14px;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    #drink-shop-draw .ds-menu-detail-title { font-size: 20px; font-weight: 500; margin: 0; }
    #drink-shop-draw .ds-menu-meta {
      color: var(--ds-muted);
      display: flex;
      flex-wrap: wrap;
      font-size: 12px;
      gap: 7px 14px;
      margin-top: 6px;
    }
    #drink-shop-draw .ds-menu-meta span { align-items: center; display: inline-flex; gap: 5px; }
    #drink-shop-draw .ds-menu-detail-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    #drink-shop-draw .ds-menu-link {
      align-items: center;
      background: var(--ds-surface-soft);
      border: 1px solid var(--ds-line);
      border-radius: 10px;
      color: var(--ds-text);
      display: inline-flex;
      font-size: 13px;
      font-weight: 500;
      gap: 6px;
      padding: 8px 10px;
      text-decoration: none;
    }
    #drink-shop-draw .ds-menu-link:focus-visible { outline: 3px solid color-mix(in srgb, var(--ds-brand) 35%, transparent); outline-offset: 2px; }
    #drink-shop-draw .ds-menu-note {
      background: var(--ds-surface-soft);
      border-radius: 12px;
      color: var(--ds-muted);
      font-size: 13px;
      margin-bottom: 18px;
      padding: 10px 12px;
    }
    #drink-shop-draw .ds-menu-group + .ds-menu-group { margin-top: 18px; }
    #drink-shop-draw .ds-menu-group h3 { font-size: 14px; font-weight: 500; margin: 0 0 7px; }
    #drink-shop-draw .ds-menu-table { border-collapse: collapse; width: 100%; }
    #drink-shop-draw .ds-menu-table th,
    #drink-shop-draw .ds-menu-table td { border-bottom: 1px solid var(--ds-line); font-size: 14px; padding: 9px 0; }
    #drink-shop-draw .ds-menu-table tr:last-child td { border-bottom: 0; }
    #drink-shop-draw .ds-menu-table th { color: var(--ds-muted); font-size: 12px; font-weight: 400; text-align: left; }
    #drink-shop-draw .ds-menu-table th:last-child,
    #drink-shop-draw .ds-menu-table td:last-child { padding-left: 12px; text-align: right; white-space: nowrap; }
    #drink-shop-draw .ds-price-pending { color: var(--ds-muted); }
    #drink-shop-draw .ds-menu-empty {
      color: var(--ds-muted);
      padding: 32px 16px;
      text-align: center;
    }
    @media (max-width: 620px) {
      #drink-shop-draw .ds-layout { grid-template-columns: 1fr; padding: 14px; }
      #drink-shop-draw .ds-topbar { padding: 14px; }
      #drink-shop-draw .ds-tabs { padding: 8px 14px; }
      #drink-shop-draw .ds-drum { min-height: 145px; }
      #drink-shop-draw .ds-menu-view { padding: 14px; }
      #drink-shop-draw .ds-menu-header { grid-template-columns: 1fr; }
      #drink-shop-draw .ds-menu-detail { padding: 14px; }
      #drink-shop-draw .ds-menu-detail-head { align-items: stretch; flex-direction: column; }
      #drink-shop-draw .ds-menu-detail-actions { justify-content: flex-start; }
    }
    @media (prefers-reduced-motion: no-preference) {
      #drink-shop-draw .ds-drum.is-drawing { animation: ds-pulse .35s ease-in-out infinite alternate; }
      @keyframes ds-pulse { to { transform: scale(.985); } }
    }
  </style>

  <section class="ds-app" aria-label="今天喝哪家店抽籤原型">
    <header class="ds-topbar">
      <div class="ds-brand">
        <span class="ds-logo"><i data-lucide="cup-soda" aria-hidden="true"></i></span>
        <div>
          <h1>今天喝哪家？</h1>
          <p class="ds-kicker">把選擇交給手氣</p>
        </div>
      </div>
      <span class="ds-count" aria-live="polite">9 家入籤</span>
    </header>

    <nav class="ds-tabs" aria-label="主要功能" role="tablist">
      <button class="ds-tab is-active" type="button" role="tab" data-view="draw" aria-controls="ds-draw-view" aria-selected="true"><i data-lucide="shuffle" aria-hidden="true"></i>抽店家</button>
      <button class="ds-tab" type="button" role="tab" data-view="menu" aria-controls="ds-menu-view" aria-selected="false"><i data-lucide="book-open" aria-hidden="true"></i>品牌菜單</button>
    </nav>

    <div class="ds-view" id="ds-draw-view" role="tabpanel" data-view-panel="draw">
      <div class="ds-layout">
        <section class="ds-panel" aria-labelledby="ds-candidates-title">
          <div class="ds-heading-row">
            <h2 id="ds-candidates-title">候選店家</h2>
            <span class="ds-note">至少選 2 家</span>
          </div>
          <details class="ds-manager" open>
            <summary>
              <span class="ds-manager-label"><i data-lucide="list" aria-hidden="true"></i><span class="ds-manager-text">管理店家</span></span>
              <i class="ds-manager-chevron" data-lucide="chevron-down" aria-hidden="true"></i>
            </summary>
            <div class="ds-manager-body">
              <div class="ds-add">
                <label class="ds-sr-only" for="ds-store-input">新增店家</label>
                <input id="ds-store-input" type="text" maxlength="30" placeholder="輸入店名，例如：再睡5分鐘" autocomplete="off">
                <button class="ds-secondary ds-add-button" type="button"><i data-lucide="plus" aria-hidden="true"></i>加入</button>
              </div>
              <div class="ds-list" aria-live="polite"></div>
            </div>
          </details>
        </section>

        <section class="ds-panel ds-draw-panel" aria-labelledby="ds-result-title">
          <h2 id="ds-result-title">抽籤結果</h2>
          <div class="ds-drum" aria-live="polite">
            <div>
              <div class="ds-result-icon"><i data-lucide="sparkles" aria-hidden="true"></i></div>
              <p class="ds-result-label">準備好了嗎？</p>
              <p class="ds-result-name">今天喝哪家</p>
            </div>
          </div>
          <div class="ds-actions">
            <button class="ds-primary ds-draw" type="button"><i data-lucide="shuffle" aria-hidden="true"></i>開始抽店家</button>
            <div class="ds-confirm">
              <button class="ds-secondary ds-redraw" type="button">再抽一次</button>
              <button class="ds-primary ds-accept" type="button"><i data-lucide="check" aria-hidden="true"></i>就喝這家</button>
            </div>
            <button class="ds-secondary ds-result-menu" type="button" hidden><i data-lucide="book-open" aria-hidden="true"></i>查看這家菜單</button>
            <p class="ds-toast" role="status"></p>
            <button class="ds-secondary ds-new-round" type="button"><i data-lucide="rotate-ccw" aria-hidden="true"></i>重新抽一輪</button>
          </div>
        </section>
      </div>
    </div>

    <section class="ds-view ds-menu-view" id="ds-menu-view" role="tabpanel" data-view-panel="menu" aria-labelledby="ds-menu-title" hidden>
      <div class="ds-menu-header">
        <div>
          <h2 id="ds-menu-title">常見連鎖品牌菜單庫</h2>
          <p class="ds-menu-intro">整理 20 家完整常態品項與北部一般門市價格；當期限定會另行標示。</p>
        </div>
        <div class="ds-search-wrap">
          <i data-lucide="search" aria-hidden="true"></i>
          <label class="ds-sr-only" for="ds-menu-search">搜尋品牌</label>
          <input class="ds-menu-search" id="ds-menu-search" type="text" placeholder="搜尋品牌或飲品" autocomplete="off">
        </div>
      </div>
      <div class="ds-menu-list" aria-live="polite"></div>
      <div class="ds-menu-detail" aria-live="polite" hidden></div>
    </section>
  </section>

  <script>
    (() => {
      const root = document.getElementById('drink-shop-draw');
      const list = root.querySelector('.ds-list');

      const viewPanels = [...root.querySelectorAll('[data-view-panel]')];
      const menuSearch = root.querySelector('.ds-menu-search');
      const menuList = root.querySelector('.ds-menu-list');
      const menuDetail = root.querySelector('.ds-menu-detail');
      const storageKey = 'drink-shop-draw-stores-v1';
      const seedVersionKey = 'drink-shop-draw-seed-version';
      const currentSeedVersion = 3;
      const defaultStores = [
        { id: 1, name: '五十嵐', active: true },
        { id: 2, name: '得正', active: true },
        { id: 3, name: '青山', active: true },
        { id: 4, name: 'CoCo都可', active: true },
        { id: 5, name: '可不可熟成紅茶', active: true },
        { id: 6, name: '迷客夏', active: true },
        { id: 7, name: '大苑子', active: true },
        { id: 8, name: '茶湯會', active: true },

      const menuGroup = (name, items) => ({

      const menuCatalog = [
        {
          name: '五十嵐', aliases: ['五十嵐', '50嵐'], sourceUrl: 'https://50lan.com/web/products.asp',

          priceSourceUrl: 'https://baliman.tw/blog/post/50lan-menu',
          priceNote: '北區常態品項與售價依 2026 年 7 月調價後公開價目整理；季節品項及特殊店型可能不同。',

            menuGroup('蕎麥與冬瓜', [['黃金蕎麥', 'L 40／瓶 80'], ['蕎麥青茶', 'L 40／瓶 80'], ['蕎麥鮮奶', 'L 65／瓶 120'], ['慢熬冬瓜露', 'L 30／瓶 60'], ['冬瓜烏龍', 'L 40／瓶 80'], ['冬瓜檸檬', 'L 55']]),

            menuGroup('嚴選茶', [['高山青茶', 'L 35／瓶 70'], ['茉香綠茶', 'L 35／瓶 70'], ['熟成紅茶', 'L 35／瓶 70'], ['小焙烏龍', 'L 35／瓶 70'], ['香蘋紅茶', 'L 40／瓶 80'], ['蜜桃紅茶', 'L 40／瓶 80']]),
            menuGroup('熬醬鮮果', [['荔枝紅茶', 'L 45／瓶 90'], ['荔枝小焙烏龍', 'L 55／瓶 110'], ['脆梅青', 'L 55／瓶 110'], ['葡萄果茶', 'M 45／L 55／瓶 110'], ['蜜桃果粒茶', 'M 45／L 55／瓶 110'], ['芒果果粒茶', 'M 60／L 70／瓶 140'], ['葡萄果粒啵啵', 'L 75／瓶 130'], ['荔枝香檸啵啵', 'L 75／瓶 130']]),
            menuGroup('鮮乳與醇奶', [['紅茶鮮奶', 'L 60／瓶 110'], ['小焙烏龍鮮奶茶', 'L 65／瓶 120'], ['波霸珍珠鮮奶茶', 'L 70／瓶 130'], ['布丁鮮奶茶', 'L 70／瓶 130'], ['極選奶茶', 'L 55／瓶 100'], ['波霸珍珠奶茶', 'L 65／瓶 120'], ['手煮泰式奶茶', 'M 55／L 65']])
          ]
        },
        {
          name: '鮮茶道', aliases: ['鮮茶道', 'Presotea'], sourceUrl: 'https://presotea.com/online-menu',
          region: '宜花東、雙北、桃竹苗一般門市', checkedAt: menuCheckedAt,
          priceSourceUrl: 'https://baliman.tw/blog/post/presotea-menu',
          priceNote: '品項依官方線上菜單，售價依 2026 一般門市公開價目整理；部分地區可能差 5–10 元。',
          groups: [
            menuGroup('鮮茶無敵', [['頂級茉莉綠茶', 'L 25／XL 45'], ['錫蘭紅茶', 'L 25／XL 45'], ['凍頂烏龍茶', 'L 25／XL 45'], ['阿里山冰茶', 'L 30／XL 50'], ['文山清茶', 'L 30／XL 50'], ['烏龍綠茶', 'L 30／XL 50'], ['伯爵紅茶', 'L 30／XL 50'], ['濃香烏龍', 'L 30／XL 50'], ['茶花綠茶', 'L 30／XL 50'], ['日式玄米茶', 'L 30／XL 50']]),
            menuGroup('特等茶', [['阿里山里佳甘露', 'L 40'], ['日月潭紅玉紅茶', 'L 40'], ['玉露煎茶', 'L 35']]),
            menuGroup('奶茶繽紛樂', [['錫蘭奶茶', 'L 35'], ['茉香奶茶', 'L 35'], ['招牌奶茶', 'L 40'], ['伯爵奶茶', 'L 40'], ['珍珠奶茶', 'L 45／XL 80'], ['熊貓珍珠奶茶', 'L 45／XL 80'], ['沖繩黑糖奶茶', 'L 45／XL 80'], ['仙草凍奶茶', 'L 45／XL 80'], ['紅豆玄米奶茶', 'L 50'], ['蜜香烏龍小珍奶', 'L 50／XL 85'], ['布丁奶茶', 'L 50']]),
            menuGroup('茶拿鐵', [['聖塔路黑可可', 'L 45／XL 80'], ['抹茶拿鐵', 'L 50／XL 85'], ['紅茶拿鐵', 'L 55／XL 90'], ['綠茶拿鐵', 'L 55／XL 90'], ['抹茶紅豆白玉', 'L 55／XL 90'], ['伯爵拿鐵', 'L 60／XL 95'], ['焙茶珍珠拿鐵', 'L 60／XL 95'], ['日月潭紅玉拿鐵', 'L 60'], ['紅豆玄米拿鐵', 'L 60']]),
            menuGroup('果然纖滋味', [['藍莓果茶', 'L 40'], ['夏夜晚風', 'L 40'], ['墾丁冰茶', 'L 40／XL 75'], ['梅果綠茶', 'L 40'], ['蜂蜜蘆薈', 'L 40／XL 75'], ['檸檬CC', 'L 40／XL 75'], ['鮮檸檬紅茶', 'L 45'], ['鮮檸檬綠茶', 'L 45'], ['鳳梨清茶', 'L 45'], ['檸檬梅子', 'L 45／XL 80'], ['鮮百香紅茶', 'L 50'], ['鮮百香綠茶', 'L 50'], ['鮮百香檸檬', 'L 50／XL 85'], ['鮮桔檸檬', 'L 50／XL 85'], ['蜂蜜檸檬', 'L 50／XL 85'], ['百香鳳梨', 'L 55'], ['鮮果雙Q紅茶', 'L 55／XL 90'], ['鮮果雙Q綠茶', 'L 55／XL 90'], ['蘋果百香多多', 'L 65／XL 95']]),
            menuGroup('冬瓜鮮爽塊', [['水晶冬瓜茶', 'L 30／XL 65'], ['冬瓜拿鐵', 'L 50／XL 85'], ['冬瓜檸檬', 'L 50／XL 85']]),
            menuGroup('雨林聯盟認證茶', [['四季春', 'L 35'], ['蜜香紅茶', 'L 35'], ['臺灣綠茶', 'L 35'], ['四季烏龍', 'L 35'], ['四季春南波萬', 'L 45'], ['蜜香果茶', 'L 45'], ['寒天四季奶青', 'L 60'], ['福祿FRUIT水果茶', 'L 65']])
          ]
        }
      ];
      const legacySeedNames = new Set([
        '五十嵐', '可不可熟成紅茶', '麻古茶坊', '龜記茗品', '得正',
        '清心福全', 'coco都可', '迷客夏', '大苑子', '珍煮丹',
        '再睡5分鐘', '萬波島嶼紅茶', '一沐日', '鶴茶樓', '茶湯會',
        'comebuy', '鮮茶道', 'mr.wish', '春水堂', '老賴茶棧',
        '上宇林', '先喝道', '八曜和茶', 'ug樂己', '拾汣茶屋'
      ]);

      function loadStores() {
        try {
          const saved = JSON.parse(window.localStorage.getItem(storageKey));
          if (Array.isArray(saved) && saved.every(store =>
            Number.isInteger(store.id) &&
            typeof store.name === 'string' &&
            store.name.trim() &&
            typeof store.active === 'boolean'
          )) {
            const savedSeedVersion = Number(window.localStorage.getItem(seedVersionKey) || 1);
            if (savedSeedVersion < currentSeedVersion) {
              const savedByName = new Map(saved.map(store => [store.name.trim().toLocaleLowerCase(), store]));
              const defaultNames = new Set(defaultStores.map(store => store.name.toLocaleLowerCase()));
              let migrationId = saved.reduce((max, store) => Math.max(max, store.id), 0) + 1;
              const migrated = defaultStores.map(store => {
                const normalizedName = store.name.toLocaleLowerCase();
                const existing = savedByName.get(normalizedName);
                return existing
                  ? { id: existing.id, name: store.name, active: existing.active }
                  : { id: migrationId++, name: store.name, active: true };
              });
              saved.forEach(store => {
                const normalizedName = store.name.trim().toLocaleLowerCase();
                if (!legacySeedNames.has(normalizedName) && !defaultNames.has(normalizedName)) {
                  migrated.push(store);
                }
              });
              window.localStorage.setItem(storageKey, JSON.stringify(migrated));
              window.localStorage.setItem(seedVersionKey, String(currentSeedVersion));
              return migrated;
            }
            return saved;
          }
          window.localStorage.setItem(seedVersionKey, String(currentSeedVersion));
        } catch (error) {
          console.warn('無法讀取已儲存的店家名單', error);
        }
        return defaultStores.map(store => ({ ...store }));
      }

      function saveStores() {
        try {
          window.localStorage.setItem(storageKey, JSON.stringify(stores));
        } catch (error) {
          console.warn('無法儲存店家名單', error);
        }
      }

      let stores = loadStores();
      let nextId = stores.reduce((max, store) => Math.max(max, store.id), 0) + 1;
      manager.open = stores.length <= 5;
      let chosen = '';
      let timer = null;
      let chosenMenuEntry = null;

      const activeStores = () => stores.filter(store => store.active);
      const normalizeBrand = value => value.toLocaleLowerCase().replace(/[\s·・._\-—–()（）\[\]【】]/g, '');
      const findMenuEntry = storeName => {
        const normalizedStore = normalizeBrand(storeName);
        return menuCatalog.find(entry => entry.aliases.some(alias => normalizedStore.includes(normalizeBrand(alias)))) || null;
      };
      const getMenuItemCount = entry => new Set(
        entry.groups.flatMap(group => group.items.map(item => normalizeBrand(item.name)))
      ).size;

      function showView(viewName) {
        tabs.forEach(tab => {
          const selected = tab.dataset.view === viewName;
          tab.classList.toggle('is-active', selected);
          tab.setAttribute('aria-selected', String(selected));
        });
        viewPanels.forEach(panel => {
          panel.hidden = panel.dataset.viewPanel !== viewName;
        });
        count.hidden = viewName === 'menu';
      }

      function renderMenuCatalog(query = '') {
        const normalizedQuery = normalizeBrand(query);
        const entries = normalizedQuery
          ? menuCatalog.filter(entry => {
              const searchable = [
                entry.name,
                ...entry.aliases,
                ...entry.groups.flatMap(group => group.items.map(item => item.name))
              ];
              return searchable.some(value => normalizeBrand(value).includes(normalizedQuery));
            })
          : menuCatalog;
        menuDetail.hidden = true;
        menuList.hidden = false;
        menuList.replaceChildren();
        if (!entries.length) {
          const empty = document.createElement('p');
          empty.className = 'ds-menu-empty';
          empty.textContent = '菜單庫裡還沒有這個品牌。';
          menuList.append(empty);
          return;
        }
        entries.forEach(entry => {
          const row = document.createElement('button');
          row.className = 'ds-menu-item';
          row.type = 'button';
          row.setAttribute('aria-label', `查看${entry.name}文字菜單`);
          const text = document.createElement('span');
          const name = document.createElement('span');
          name.className = 'ds-menu-name';
          name.textContent = entry.name;
          const summary = document.createElement('span');
          summary.className = 'ds-menu-summary';
          summary.textContent = `${getMenuItemCount(entry)} 項整理・確認 ${entry.checkedAt}`;
          const arrow = document.createElement('i');
          arrow.className = 'ds-menu-arrow';
          arrow.dataset.lucide = 'chevron-right';
          arrow.setAttribute('aria-hidden', 'true');
          text.append(name, summary);
          row.append(text, arrow);
          row.addEventListener('click', () => showMenuDetail(entry));
          menuList.append(row);
        });
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function showMenuDetail(entry) {
        menuList.hidden = true;
        menuDetail.hidden = false;
        menuDetail.replaceChildren();

        const head = document.createElement('div');
        head.className = 'ds-menu-detail-head';
        const titleBlock = document.createElement('div');
        const title = document.createElement('h3');
        title.className = 'ds-menu-detail-title';
        title.textContent = entry.name;
        const meta = document.createElement('div');
        meta.className = 'ds-menu-meta';
        const region = document.createElement('span');
        region.innerHTML = '<i data-lucide="map-pin" aria-hidden="true"></i>';
        region.append(document.createTextNode(entry.region));
        const checked = document.createElement('span');
        checked.innerHTML = '<i data-lucide="calendar-check" aria-hidden="true"></i>';
        checked.append(document.createTextNode(`最後確認 ${entry.checkedAt}`));
        meta.append(region, checked);
        titleBlock.append(title, meta);

        const actions = document.createElement('div');
        actions.className = 'ds-menu-detail-actions';
        const back = document.createElement('button');
        back.className = 'ds-secondary';
        back.type = 'button';
        back.innerHTML = '<i data-lucide="arrow-left" aria-hidden="true"></i>返回品牌列表';
        back.addEventListener('click', () => renderMenuCatalog(menuSearch.value));
        const source = document.createElement('a');
        source.className = 'ds-menu-link';
        source.href = entry.sourceUrl;
        source.target = '_blank';
        source.rel = 'noopener noreferrer';
        source.innerHTML = '查看官方來源<i data-lucide="external-link" aria-hidden="true"></i>';
        actions.append(back, source);
        if (entry.priceSourceUrl && entry.priceSourceUrl !== entry.sourceUrl) {
          const priceSource = document.createElement('a');
          priceSource.className = 'ds-menu-link';
          priceSource.href = entry.priceSourceUrl;
          priceSource.target = '_blank';
          priceSource.rel = 'noopener noreferrer';
          priceSource.innerHTML = '查看價格來源<i data-lucide="external-link" aria-hidden="true"></i>';
          actions.append(priceSource);
        }
        head.append(titleBlock, actions);

        const note = document.createElement('p');
        note.className = 'ds-menu-note';
        note.textContent = entry.priceNote;
        menuDetail.append(head, note);

        entry.groups.forEach(group => {
          const section = document.createElement('section');
          section.className = 'ds-menu-group';
          const heading = document.createElement('h3');
          heading.textContent = group.name;
          const table = document.createElement('table');
          table.className = 'ds-menu-table';
          const thead = document.createElement('thead');
          const headRow = document.createElement('tr');
          const drinkHead = document.createElement('th');
          drinkHead.scope = 'col';
          drinkHead.textContent = '飲品';
          const priceHead = document.createElement('th');
          priceHead.scope = 'col';
          priceHead.textContent = '價格';
          headRow.append(drinkHead, priceHead);
          thead.append(headRow);
          const body = document.createElement('tbody');
          group.items.forEach(item => {
            const row = document.createElement('tr');
            const drink = document.createElement('td');
            drink.textContent = item.name;
            const price = document.createElement('td');
            price.textContent = item.price || '依門市';
            if (!item.price) price.className = 'ds-price-pending';
            row.append(drink, price);
            body.append(row);
          });
          table.append(thead, body);
          section.append(heading, table);
          menuDetail.append(section);
        });
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function updateState() {
        const active = activeStores().length;
        count.textContent = `${active} 家入籤`;
        managerText.textContent = `管理店家（${active} / ${stores.length} 家入籤）`;
        drawButton.disabled = active < 2;
        if (active < 2) {
          resultMenuButton.hidden = true;
          drawButton.classList.remove('is-hidden');
          newRoundButton.classList.remove('is-visible');
          resultLabel.textContent = '還不能抽喔';
          resultName.textContent = '請至少選 2 家';
          confirm.classList.remove('is-visible');
        } else if (!chosen) {
          resultMenuButton.hidden = true;
          drawButton.classList.remove('is-hidden');
          newRoundButton.classList.remove('is-visible');
          resultLabel.textContent = '準備好了嗎？';
          resultName.textContent = '今天喝哪家';
          confirm.classList.remove('is-visible');
        }
      }

      function render() {
        list.replaceChildren();
        stores.forEach(store => {
          const row = document.createElement('div');
          row.className = 'ds-store';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = store.active;
          checkbox.setAttribute('aria-label', `${store.name}加入抽籤`);
          checkbox.addEventListener('change', () => {
            store.active = checkbox.checked;
            saveStores();
            chosen = '';
            toast.classList.remove('is-visible');
            updateState();
          });
          const name = document.createElement('span');
          name.className = 'ds-store-name';
          name.textContent = store.name;
          const remove = document.createElement('button');
          remove.className = 'ds-remove';
          remove.type = 'button';
          remove.setAttribute('aria-label', `移除${store.name}`);
          remove.innerHTML = '<i data-lucide="x" aria-hidden="true"></i>';
          remove.addEventListener('click', () => {
            stores = stores.filter(item => item.id !== store.id);
            saveStores();
            chosen = '';
            render();
          });
          row.append(checkbox, name, remove);
          list.append(row);
        });
        updateState();
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function draw() {
        const pool = activeStores();
        if (pool.length < 2 || timer) return;
        toast.classList.remove('is-visible');
        resultMenuButton.hidden = true;
        newRoundButton.classList.remove('is-visible');
        confirm.classList.remove('is-visible');
        drawButton.classList.add('is-hidden');
        drawButton.disabled = true;
        drum.classList.add('is-drawing');
        resultLabel.textContent = '籤筒轉動中…';
        let ticks = 0;
        timer = window.setInterval(() => {
          resultName.textContent = pool[ticks % pool.length].name;
          ticks += 1;
          if (ticks >= 13) {
            window.clearInterval(timer);
            timer = null;
            chosen = pool[Math.floor(Math.random() * pool.length)].name;
            chosenMenuEntry = findMenuEntry(chosen);
            resultLabel.textContent = '今天就喝';
            resultName.textContent = chosen;
            drum.classList.remove('is-drawing');
            confirm.classList.add('is-visible');
            resultMenuButton.hidden = !chosenMenuEntry;
            drawButton.disabled = false;
          }
        }, 90);
      }

      function addStore() {
        const name = input.value.trim();
        if (!name) {
          input.focus();
          return;
        }
        if (stores.some(store => store.name.toLocaleLowerCase() === name.toLocaleLowerCase())) {
          input.setCustomValidity('這家店已經在候選名單裡了');
          input.reportValidity();
          return;
        }
        input.setCustomValidity('');
        stores.push({ id: nextId++, name, active: true });
        saveStores();
        input.value = '';
        chosen = '';
        render();
        input.focus();
      }
      addButton.addEventListener('click', addStore);
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          addStore();
        }
      });
      input.addEventListener('input', () => input.setCustomValidity(''));
      tabs.forEach(tab => tab.addEventListener('click', () => {
        showView(tab.dataset.view);
        if (tab.dataset.view === 'menu') {
          menuSearch.value = '';
          renderMenuCatalog();
        }
      }));
      menuSearch.addEventListener('input', () => renderMenuCatalog(menuSearch.value));
      drawButton.addEventListener('click', draw);
      redrawButton.addEventListener('click', draw);
      acceptButton.addEventListener('click', () => {
        toast.textContent = `決定了，今天喝「${chosen}」！`;
        toast.classList.add('is-visible');
        confirm.classList.remove('is-visible');
        newRoundButton.classList.add('is-visible');
      });
      resultMenuButton.addEventListener('click', () => {
        if (!chosenMenuEntry) return;
        menuSearch.value = '';
        showView('menu');
        showMenuDetail(chosenMenuEntry);
      });
      newRoundButton.addEventListener('click', draw);
      renderMenuCatalog();
      render();
    })();
  </script>
</div>
